<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Price Prediction — Valuation Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sheet">
    <div class="eyebrow">Field Estimate No. 001</div>
    <h1>Property Valuation Ledger</h1>
    <p class="subtitle">Enter the property details below. The estimate is generated by a regression model trained on Bangalore housing data.</p>

    <div class="field">
      <label for="location">Location</label>
      <select id="location">
        <option value="">Loading locations…</option>
      </select>
    </div>

    <div class="field">
      <label for="sqft">Total Sqft</label>
      <input type="number" id="sqft" placeholder="e.g. 1000" min="1">
    </div>

    <div class="field">
      <label for="bhk">Bedrooms (BHK)</label>
      <input type="number" id="bhk" placeholder="e.g. 2" min="1" max="10">
    </div>

    <div class="field">
      <label for="bath">Bathrooms</label>
      <input type="number" id="bath" placeholder="e.g. 2" min="1" max="10">
    </div>

    <div class="actions">
      <button id="predict-btn">Estimate Price</button>
      <span id="status-line"></span>
    </div>

    <div class="result" id="result">
      <div class="stamp">Estimated</div>
      <div class="result-value" id="result-value">— <span>lakhs</span></div>
    </div>

    <div class="footer-note">
      API: <span id="api-url">http://127.0.0.1:5000</span> — make sure the Flask server (server.py) is running before estimating.
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
